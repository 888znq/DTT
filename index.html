<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplier Dashboard - LIVE TV</title>
    
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    
        <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000432">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        html { height: 100%; }

        body {
            margin: 0;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: 0;
            padding-right: 0;
            background-color: #000432;
            color: #c8d0e7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            box-sizing: border-box;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            border: none;
            box-sizing: border-box;
            background: #000432;
        }

        /* --- Quick Pairs Bar --- */
        .quick-pairs-inline {
            display: flex;
            flex: 1 1 0%;
            gap: 0;
            overflow-x: visible;
            scrollbar-width: none;
            padding-right: 0;
        }
        .quick-pairs-inline::-webkit-scrollbar { display: none; }

        .quick-pair-btn {
            min-width: 0;
            background: transparent;
            color: #8892b0;
            border: none;
            border-right: 1px solid #ffffff !important;
            padding: 0 6px;
            margin: 0;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 0;
            white-space: nowrap;
            text-align: center;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 4px;
            align-self: stretch;
            height: auto;
            box-sizing: border-box;
            overflow: hidden;
        }
        .quick-pair-btn:hover { color: #c8d0e7; }
        .quick-pair-btn.active {
            background: transparent;
            color: #00e5ff;
            border: none;
            border-right: 1px solid #ffffff !important;
        }
        .quick-pair-btn.active .payout-pct { color: #00e5ff; }

        .payout-pct {
            display: inline;
            font-size: 10px;
            font-weight: 800;
            color: #0ecb81;
            margin-top: 0;
        }

        /* --- Bottom Controls --- */
        .bottom-controls {
            display: flex !important;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 2px 5px;
            background: #000432;
            border-top: 1px solid #333;
            box-sizing: border-box;
            width: 100%;
        }
        .bottom-controls::-webkit-scrollbar { display: none; }

        .control-item {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            padding: 0 2px;
            background: #000432;
            white-space: nowrap;
            gap: 2px;
        }
        .control-item svg { margin-right: 2px !important; width: 16px !important; height: 16px !important; }

        select, input {
                    background-color: #000432;
                    color: #c8d0e7;
                    border: 1px solid #ffffff;
                    padding: 4px;
                    width: 44px;
                    border-radius: 6px;
                    text-align: center;
                    font-family: inherit;
                    outline: none;
                }
                select option {
                    background-color: #000432;
                    color: #c8d0e7;
                }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }

        #conn-status { display: none !important; }

        /* --- Action Buttons --- */
        .action-btn {
            border: 1px solid #ffffff;
            padding: 6px 8px !important;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin: 0 2px !important;
            letter-spacing: 0.05em;
            background: #000432;
        }
        .btn-log { color: #8892b0; }
        .btn-call { color: #0ecb81; } /* MULTUP */
        .btn-put { color: #f6465d; }  /* MULTDOWN */
        .btn-close { color: #ffcc00; border-color: #ffcc00; }

        /* --- Chart Section --- */
        .chart-section {
            flex: 1;
            background-color: #000432;
            position: relative;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            flex-direction: row;
            margin: 0;
            border-radius: 0;
            border: none;
        }

        #canvas-wrapper { width: 100%; height: 100%; position: relative; }
        #custom-chart { width: 100%; height: 100%; display: block; }

        #loading-text {
            color: #ffcc00;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 10;
            position: absolute;
            top: 50%;
            left: 35%;
            transform: translate(-50%, -50%);
        }

        #fullscreen-btn { display: none !important; }
        #zoom-controls { display: none !important; }
        .zoom-btn {
            background: rgba(0, 4, 50, 0.85);
            border: 1px solid #ffffff;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            color: #ffcc00;
            font-size: 16px;
            font-weight: bold;
        }


        /* --- Open Positions Panel (floating, multiplier-specific) --- */
        .positions-panel {
                            position: relative;
                            width: 100%;
                            flex-shrink: 0;
                            max-height: 480px;
                            background: rgba(0, 4, 50, 0.95);
                            border: 1px solid #ffffff;
                            border-left: none;
                            border-right: none;
                            border-radius: 0;
                            z-index: 25;
                            font-size: 11px;
                            display: flex;
                            flex-direction: column;
                            box-sizing: border-box;
                        }
                        #positionsList, #closedList {
                                                    display: flex;
                                                    flex-direction: column;
                                                    gap: 8px;
                                                    padding: 6px 8px;
                                                    overflow-y: auto;
                                                    min-height: 0;
                                                }
                                                #positionsList { display: none !important; }
                        .pos-track {
                            display: flex;
                            flex-direction: row;
                            gap: 8px;
                            overflow-x: auto;
                            padding-bottom: 2px;
                        }
                        #positionsList::-webkit-scrollbar, #closedList::-webkit-scrollbar { width: 5px; }
                        .pos-track::-webkit-scrollbar { height: 5px; }
                .positions-header {
                    padding: 6px 8px;
                    font-weight: 800;
                    letter-spacing: 0.05em;
                    color: #ffcc00;
                    border-bottom: 1px solid #333;
                    font-size: 10px;
                }
                .position-row {
                                    padding: 6px 8px;
                                    border: 1px solid #1a1e3a;
                                    border-radius: 6px;
                                    display: flex;
                                    flex-direction: column;
                                    gap: 2px;
                                    cursor: pointer;
                                    flex: 0 0 260px;
                                    width: 260px;
                                }
                .position-row .pr-top {
                    display: flex;
                    justify-content: space-between;
                    font-weight: 800;
                }
                .position-row .pr-bottom {
                    display: flex;
                    justify-content: space-between;
                    color: #8892b0;
                    font-size: 10px;
                }
                .position-row .pr-detail {
                                    display: flex;
                                    margin-top: 4px;
                                    padding-top: 4px;
                                    border-top: 1px dashed #333;
                                    flex-direction: column;
                                    gap: 3px;
                                }
                .position-row.expanded .pr-detail { display: flex; }
                .position-row .pr-detail-line {
                    display: flex;
                    justify-content: space-between;
                    color: #c8d0e7;
                    font-size: 10px;
                }
                .position-row .pr-detail-line .lbl { color: #8892b0; }
                .position-row .pr-close {
                    margin-top: 4px;
                    background: transparent;
                    border: 1px solid #ffcc00;
                    color: #ffcc00;
                    border-radius: 4px;
                    font-size: 10px;
                    font-weight: 800;
                    padding: 4px;
                    cursor: pointer;
                }
                .positions-empty {
                    padding: 10px 8px;
                    color: #8892b0;
                    text-align: center;
                    font-size: 10px;
                }
                .positions-header-bar {
                                    display: flex;
                                    align-items: center;
                                    justify-content: space-between;
                                    padding: 5px 8px;
                                    border-bottom: 1px solid #333;
                                }
                                .positions-header-label {
                                    font-size: 10px;
                                    font-weight: 800;
                                    color: #ffcc00;
                                    letter-spacing: 0.05em;
                                }
                                .show-closed-btn {
                                    background: transparent;
                                    border: 1px solid #8892b0;
                                    color: #8892b0;
                                    border-radius: 4px;
                                    font-size: 9px;
                                    font-weight: 800;
                                    padding: 3px 8px;
                                    cursor: pointer;
                                    letter-spacing: 0.05em;
                                }
                                .show-closed-btn.active {
                                    color: #ffcc00;
                                    border-color: #ffcc00;
                                }
                                .position-row.closed {
                                                                    opacity: 0.6;
                                                                }
                                                                .script-item {
                                                                    display: flex;
                                                                    align-items: center;
                                                                    justify-content: space-between;
                                                                    padding: 6px 8px;
                                                                    border: 1px solid #1a1e3a;
                                                                    border-radius: 6px;
                                                                    margin-bottom: 6px;
                                                                    cursor: pointer;
                                                                    font-size: 11px;
                                                                    color: #c8d0e7;
                                                                }
                                                                .script-item.active {
                                                                    border-color: #38bdf8;
                                                                    background: rgba(56,189,248,0.08);
                                                                }
                                                                .script-item-name {
                                                                    overflow: hidden;
                                                                    text-overflow: ellipsis;
                                                                    white-space: nowrap;
                                                                    flex: 1;
                                                                    margin-right: 8px;
                                                                }
                                                                .script-item-actions {
                                                                    display: flex;
                                                                    gap: 4px;
                                                                    flex-shrink: 0;
                                                                }
                                                                .script-act-btn {
                                                                    background: transparent;
                                                                    border: 1px solid #333;
                                                                    color: #8892b0;
                                                                    border-radius: 4px;
                                                                    font-size: 10px;
                                                                    font-weight: 800;
                                                                    padding: 3px 6px;
                                                                    cursor: pointer;
                                                                }
                                                                .script-act-btn.edit:hover { color: #38bdf8; border-color: #38bdf8; }
                                                                .script-act-btn.apply:hover { color: #0ecb81; border-color: #0ecb81; }
                                                                .script-act-btn.delete:hover { color: #f6465d; border-color: #f6465d; }
                                
                                        </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="chart-section">
            <div id="loading-text">LOADING MARKET DATA...</div>
            <button id="fullscreen-btn" aria-label="Toggle Fullscreen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></button>

            </div>
            
                    <!-- Live Multiplier positions (open + closed unified) -->

            <div class="segmented-bar" style="display: flex; align-items: stretch; border: 1px solid #ffffff; border-radius: 3px; overflow: hidden; height: 36px;">

                <div style="display: flex; align-items: center; justify-content: center; padding: 0 12px; border-right: 1px solid #ffffff; background: transparent; cursor: pointer;">

                <button id="trade-btn-put-row2" class="action-btn btn-put" style="border: none; border-right: 1px solid #ffffff !important; border-radius: 0; background: #f6465d; padding: 0 16px !important; font-size: 13px; color: #ffffff; margin: 0 !important; height: 100%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold;">SELL</button>

                                <button id="show-trades-btn" class="action-btn btn-log" style="border: none; border-right: 1px solid #ffffff !important; border-radius: 0; background: transparent; padding: 0 10px !important; font-size: 11px; color: #ffcc00; margin: 0 !important; height: 100%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; white-space: nowrap;">POSITIONS</button>

        function drawChart() {

                        const maxVisibleCandles = Math.floor(chartAreaWidth / totalCandleWidth);

                        const sliceStart = Math.max(0, sliceEnd - maxVisibleCandles);

            let minPrice = Infinity;

                if (c.low < minPrice) minPrice = c.low;

            });

            const priceRange = maxPrice - minPrice || 1;
                        const paddedMin = minPrice - (priceRange * 0.08);

                        const paddedRange = paddedMax - paddedMin;
            
                        const verticalMargin = Math.min(50, chartHeight * 0.12);
                        const plotHeight = Math.max(1, chartHeight - (verticalMargin * 2));
            
                        function getY(price) {
                            return verticalMargin + plotHeight - ((price - paddedMin) / paddedRange) * plotHeight;

            ctx.fillStyle = '#888';

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            const dec = paddedMax < 10 ? 5 : (paddedMax < 1000 ? 3 : 2);

            ctx.lineWidth = 1;
                        for (let i = 1; i < 6; i++) {
                            let yLine = verticalMargin + (plotHeight / 6) * i;
                            ctx.strokeStyle = '#ffffff';
                            ctx.lineWidth = 0.2;
                            ctx.beginPath();
                            ctx.moveTo(0, yLine);
                            ctx.lineTo(canvasWidth - yAxisWidth, yLine);
                            ctx.stroke();
                            let priceAtLine = paddedMax - (paddedRange * (i / 6));

            const vGridRightEdge = canvasWidth - yAxisWidth;

            ctx.moveTo(0, 0);
            ctx.lineTo(0, chartHeight);

            const lastCandle = currentCandles[currentCandles.length - 1];

            for (let i = 0; i < visibleCandles.length; i++) {

                const isUp = c.close >= c.open;
                const color = isUp ? '#0ecb81' : '#f6465d';

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const x = chartAreaWidth - ((visibleCandles.length - i) * totalCandleWidth);

                const yOpen = getY(c.open);
                const yClose = getY(c.close);

        async function connect() {
            connStatus.innerText = 'CONNECTING';

            try {
                const accountId = await getRealAccountId(currentAccountType);
                wsUrl = await getWsUrl(accountId);
            } catch (err) {
                console.error("Auth handshake failed:", err);
                alert("⚠️ Deriv Auth Error: " + err.message);
                connStatus.innerText = 'OFFLINE';
                connStatus.style.background = '#f6465d';
                setTimeout(connect, 5000);
                return;
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                connStatus.innerText = 'ONLINE';
                connStatus.style.background = '#0ecb81';
                ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                resizeCanvas();
                fetchPairData(currentPair);
                fetchPayouts();
                subscribeAllOpenContracts();
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);

                if (data.error) {
                    console.error("API Error:", data.error.message);

                    if (data.error.code === 'AlreadySubscribed' || data.error.message.includes('already subscribed')) {
                        return;
                    }
                    if (data.error.code === 'RateLimit' || data.error.message.includes('rate limit')) {
                        console.warn("Deriv API Rate Limit hit - request ignored.");
                        return;
                    }

                    var _isProposalReq = data.echo_req && data.echo_req.proposal === 1;
                    if (_isProposalReq) {
                        console.warn("Proposal unavailable for " + data.echo_req.underlying_symbol + ": " + data.error.message);
                        return;
                    }
                    if (data.error.code === 'InvalidToken' || data.error.code === 'AuthorizationRequired') {
                        alert("⚠️ API ERROR: Your session is no longer valid.\n\nThe page will attempt to reconnect automatically.");
                    } else if (data.error.code === 'InvalidContractParameters') {
                        alert("⚠️ PARAMETER ERROR: This multiplier is not available for this symbol.\n\nTry a lower multiplier or a different symbol.");
                    } else {
                        alert("⚠️ Deriv API Error: " + data.error.message);
                    }
                    return;
                }

                if (data.balance) {
                    balanceDisplay.innerText = `$${data.balance.balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                    balanceDisplay.style.color = currentAccountType === 'real' ? '#0ecb81' : '#ffcc00';
                }

                if (data.candles) {
                                    const symbol = data.echo_req.ticks_history;
                                    if (data.echo_req.subscribe) {
                                        if (data.subscription && data.subscription.id) candleSubscriptions[symbol] = data.subscription.id;

                                        const resolveBackfill = backfillPending[symbol];

        // --- Position state helper (single source of truth for open vs closed) ---
                        function isPositionOpen(p) {
                            return !(p.is_sold || p.status === 'sold' || p.status === 'won' || p.status === 'lost');
                        }
        
                        // --- Derived multiplier metrics not directly given by the API ---
                        function computeDerivedMetrics(p) {
                    const entry = Number(p.entry_spot);
                    const mult = Number(p.multiplier);
                    const stake = Number(p.buy_price);
                    const commission = Number(p.commission) || 0;
                    const isUp = p.contract_type === 'MULTUP';
        
                    // Breakeven: the spot price at which profit first turns positive,
                    // i.e. where price movement has just covered the commission cost.
                    // priceMovePct needed to cover commission = commission / (stake * multiplier)
                    let breakeven = null;
                                        if (entry && mult && stake) {
                                            const roundtripFee = commission * 2;
                                            const pctToCoverFee = roundtripFee / (stake * mult);
                                            breakeven = isUp ? entry * (1 + pctToCoverFee) : entry * (1 - pctToCoverFee);
                                        }
        
                    // Stop-out / liquidation level: prefer the API's own stop_out level if present,
                    // otherwise estimate it as the price move that would wipe out the full stake.
                    let stopOut = null;
                    if (p.limit_order && p.limit_order.stop_out && p.limit_order.stop_out.order_amount != null) {
                        stopOut = Number(p.limit_order.stop_out.order_amount);
                    } else if (entry && mult) {
                        const fullLossPct = 1 / mult;
                        stopOut = isUp ? entry * (1 - fullLossPct) : entry * (1 + fullLossPct);
                    }
        
                    return { breakeven, stopOut };
                }

                                                                                                    const all = Object.values(positions).sort((a, b) => (b.date_start || 0) - (a.date_start || 0));
                                                                                                    const closedList = all.filter(p => !isPositionOpen(p));
                                                                                                    const list = document.getElementById('closedTradeList');
                                                                                                    if (closedList.length === 0) {
                                                                                                        list.innerHTML = '<div style="color:#8892b0; text-align:center; padding:20px; font-size:12px; font-weight:bold; letter-spacing:0.05em;">NO CLOSED POSITIONS</div>';
                                                                                                        return;
                                                                                                    }
                                                                                                    list.innerHTML = closedList.map(renderPositionCard).join('');
                                                                                                }
                                        
                                                function stake_fmt(p) {
                                                    return Number(p.buy_price).toFixed(2);
                                                }

        function updateTradeModalUI(posList) {
                    const list = document.getElementById('tradeList');
                    if (!posList || posList.length === 0) {
                        list.innerHTML = '<div style="color:#8892b0; text-align:center; padding:20px; font-size:12px; font-weight:bold; letter-spacing:0.05em;">NO POSITIONS OPEN</div>';
                        return;
                    }
                    let html = '';
                    posList.forEach(p => {
                const profit = Number(p.profit) || 0;
                const color = profit >= 0 ? '#0ecb81' : '#f6465d';
                const dirLabel = p.contract_type === 'MULTUP' ? 'UP' : 'DOWN';
                html += `
                    <div style="display:flex; justify-content:space-between; background:#000432; padding:12px; border-radius:10px; border-left:3px solid ${color}; margin-bottom:10px;">
                        <div style="display:flex; flex-direction:column; gap:4px;">
                            <span style="font-weight:bold; color:white; font-size:12px;">${p.underlying_symbol} ${dirLabel} x${p.multiplier} <span style="color:#888; font-size:10px;">#${p.contract_id}</span></span>
                            <span style="color:#aaa; font-size:10px;">STAKE: $${Number(p.buy_price).toFixed(2)}</span>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:4px; text-align:right;">
                            <span style="font-weight:bold; font-size:12px; color:${color};">$${profit.toFixed(2)}</span>
                            <button class="pr-close" data-cid="${p.contract_id}" style="background:transparent;border:1px solid #ffcc00;color:#ffcc00;border-radius:4px;font-size:10px;font-weight:800;padding:3px 8px;cursor:pointer;">CLOSE</button>
                        </div>
                    </div>`;
            });
            list.innerHTML = html;
            list.querySelectorAll('.pr-close').forEach(btn => {
                btn.addEventListener('click', () => closePosition(Number(btn.getAttribute('data-cid'))));
            });
        }

        document.getElementById('showClosedBtn').addEventListener('click', () => {
                                    document.getElementById('closedModal').style.display = 'flex';
                                    document.getElementById('closedModalOverlay').style.display = 'block';
                                    updateClosedModalUI();
                                });
                        
                                document.getElementById('close-closed-modal-btn').addEventListener('click', () => {
                                    document.getElementById('closedModal').style.display = 'none';
                                    document.getElementById('closedModalOverlay').style.display = 'none';
                                });
                                document.getElementById('closedModalOverlay').addEventListener('click', () => {
                                    document.getElementById('closedModal').style.display = 'none';
                                    document.getElementById('closedModalOverlay').style.display = 'none';
                                });
                
                        document.getElementById('show-trades-btn').addEventListener('click', () => {
                            document.getElementById('tradeModal').style.display = 'flex';
                            document.getElementById('tradeModalOverlay').style.display = 'block';
                            updateTradeModalUI(Object.values(positions).filter(isPositionOpen));
                        });
        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('tradeModal').style.display = 'none';
            document.getElementById('tradeModalOverlay').style.display = 'none';
        });
        document.getElementById('tradeModalOverlay').addEventListener('click', () => {
            document.getElementById('tradeModal').style.display = 'none';
            document.getElementById('tradeModalOverlay').style.display = 'none';
        });

        // --- CLOSE A POSITION (sell at market) ---
        function closePosition(contractId) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Not connected.");
                return;
            }
            ws.send(JSON.stringify({ sell: contractId, price: 0 }));
        }

        // --- CHART DATA PROCESSORS ---
        function requestCandleBatch(symbol, granularity, endEpoch) {
                            return new Promise((resolve) => {
                                backfillPending[symbol] = resolve;
                                ws.send(JSON.stringify({
                                    ticks_history: symbol,
                                    style: "candles",
                                    granularity: granularity,
                                    end: endEpoch,
                                    count: MAX_CANDLES_PER_REQUEST
                                }));
                            });
                        }
        
                function dedupeCandles(candles) {
                    const seen = new Set();
                    return candles.filter(c => {
                        if (seen.has(c.time)) return false;
                        seen.add(c.time);
                        return true;
                    });
                }
        
                async function backfillCandles(symbol, granularity) {
                    let all = [];
                    let endEpoch = "latest";
                    for (let i = 0; i < MAX_BACKFILL_BATCHES; i++) {
                        if (symbol !== currentPair) return; // abandoned - user switched pairs mid-backfill
                        const batch = await requestCandleBatch(symbol, granularity, endEpoch);
                        if (!batch || batch.length === 0) break;
                        all = batch.concat(all); // older batch first - each batch already comes back ascending
                        if (symbol === currentPair) {
                                                    marketData[symbol] = all.map(c => ({ time: Number(c.epoch), open: Number(c.open), high: Number(c.high), low: Number(c.low), close: Number(c.close) }));
                                                    activeIndicators.forEach(ind => ind.calculate(marketData[symbol]));
                                                    drawChart();
                                                }
                        if (batch.length < MAX_CANDLES_PER_REQUEST) break; // hit the earliest data the server has
                        endEpoch = Number(batch[0].epoch) - granularity;
                    }
                    if (symbol === currentPair && marketData[symbol]) {
                        marketData[symbol] = dedupeCandles(marketData[symbol]);
                    }
                }
        
                function subscribeCandleStream(symbol, granularity) {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    ws.send(JSON.stringify({
                        ticks_history: symbol,
                        style: "candles",
                        granularity: granularity,
                        end: "latest",
                        count: 1,
                        subscribe: 1
                    }));
                }
        
                function fetchPairData(symbol) {
                    marketData[symbol] = [];
        
                    if (candleSubscriptions[symbol]) {
                        ws.send(JSON.stringify({ forget: candleSubscriptions[symbol] }));
                        delete candleSubscriptions[symbol];
                    }
        
                    const granularity = getCandleDuration();
                    backfillCandles(symbol, granularity).then(() => {
                        if (symbol === currentPair) subscribeCandleStream(symbol, granularity);
                    });
                }

        // --- Multiplier proposal (cost/price stream) per tracked pair ---
        function fetchPayouts() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const stake = parseFloat(document.getElementById('trade-amount').value) || 10;
            const multiplier = Number(multiplierSelect.value) || 100;

            trackedPairs.forEach(symbol => {
                if (payoutSubscriptions[symbol]) {
                    ws.send(JSON.stringify({ forget: payoutSubscriptions[symbol] }));
                    delete payoutSubscriptions[symbol];
                }
                ws.send(JSON.stringify({
                    proposal: 1,
                    subscribe: 1,
                    amount: Number(stake),
                    basis: "stake",
                    contract_type: "MULTUP",
                    currency: "USD",
                    multiplier: multiplier,
                    underlying_symbol: symbol
                }));
            });
        }

        function switchPairView(newPair) {
                            currentPair = newPair;
                            chartPanOffset = 0;
                            if (!marketData[newPair] || marketData[newPair].length === 0) {
                        loadingText.style.display = 'block';
                        if (ws && ws.readyState === WebSocket.OPEN) fetchPairData(newPair);
                    } else {
                        activeIndicators.forEach(ind => ind.calculate(marketData[newPair]));
                        drawChart();
                    }
                }

        function getCandleDuration() {
                            return (parseInt(candleTimeInput.value) || 30);
                        }
        
                function formatCandleCountdown(seconds) {
                            seconds = Math.max(0, Math.floor(seconds));
                            const m = Math.floor(seconds / 60);
                            const s = seconds % 60;
                            if (m > 0) return `${m}:${s.toString().padStart(2, '0')}`;
                            return `${s}s`;
                        }

        function processOhlcUpdate(ohlc) {
                    const symbol = ohlc.symbol || currentPair;
                    if (ohlc.id) candleSubscriptions[symbol] = ohlc.id;
        
                    const granularity = Number(ohlc.granularity) || getCandleDuration();
                    const time = ohlc.open_time != null ? Number(ohlc.open_time) : Math.floor(Number(ohlc.epoch) / granularity) * granularity;
                    const candle = {
                        time: time,
                        open: Number(ohlc.open),
                        high: Number(ohlc.high),
                        low: Number(ohlc.low),
                        close: Number(ohlc.close)
                    };
        
                    let candles = marketData[symbol];
                    if (!candles) candles = marketData[symbol] = [];
        
                    const last = candles[candles.length - 1];
                    if (last && last.time === candle.time) {
                        candles[candles.length - 1] = candle;
                    } else if (!last || candle.time > last.time) {
                        candles.push(candle);
                    } else {
                        return;
                    }
        
                    if (symbol === currentPair) {
                                            activeIndicators.forEach(ind => ind.calculate(marketData[symbol]));
                                            drawChart();
                                        }
                                    }
                    
                            candleTimeInput.addEventListener('change', () => {
                    loadingText.style.display = 'block';
                    chartPanOffset = 0;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        marketData = {};
                        fetchPairData(currentPair);
                    }
                });

        document.getElementById('trade-amount').addEventListener('change', fetchPayouts);
        multiplierSelect.addEventListener('change', fetchPayouts);

        // --- EXECUTE MULTIPLIER TRADE (MULTUP / MULTDOWN) ---
        function executeTrade(type) {
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        alert("Please wait, connecting to server...");
                        return;
                    }
                    const stake = parseFloat(document.getElementById('trade-amount').value) || 10;
                    const multiplier = Number(multiplierSelect.value) || 100;
        
                    const parameters = {
                        amount: Number(stake),
                        basis: "stake",
                        contract_type: type, // MULTUP or MULTDOWN
                        currency: "USD",
                        multiplier: multiplier,
                        underlying_symbol: currentPair
                    };
        
                    const tradePayload = {
                        buy: "1",
                        price: Number(stake), // max price willing to pay to open (stake basis)
                        parameters: parameters
                    };
        
                    ws.send(JSON.stringify(tradePayload));
                }

        document.getElementById('trade-btn-row2').addEventListener('click', () => executeTrade("MULTUP"));
        document.getElementById('trade-btn-put-row2').addEventListener('click', () => executeTrade("MULTDOWN"));

        const pairSelect = document.getElementById('pair-select');
                pairSelect.value = currentPair;
                pairSelect.addEventListener('change', (e) => {
                    switchPairView(e.target.value);
                    if (ws && ws.readyState === WebSocket.OPEN) subscribeSinglePayout(e.target.value);
                });
        
                window.addEventListener('message', (event) => {
            const raw = event.data?.trinityOS_pair;
            if (!raw || typeof raw !== 'string') return;
            console.log("📺 TRM Live TV Received Signal:", raw);
            const pair = resolveTrackedPair(raw);
            if (!pair) return;
            receiveTrinityPair(pair);
        });

        function resolveTrackedPair(raw) {
            if (trackedPairs.includes(raw)) return raw;
            var match = trackedPairs.find(function(p) {
                return p.replace(/^(frx|cry|1HZ)/i, '').toUpperCase() === raw.toUpperCase();
            });
            return match || null;
        }

        function receiveTrinityPair(pair) {
                    if (!trackedPairs.includes(pair)) trackedPairs.push(pair);
                    ensureQuickPairButton(pair);
                    switchPairView(pair);
                    pairSelect.value = pair;
                    if (ws && ws.readyState === WebSocket.OPEN) subscribeSinglePayout(pair);
                }

        // ANDROID CLIPBOARD BRIDGE — same as before, kept for native split-pane WebViews.
        let lastAndroidClipPair = null;
        if (window.AndroidClipboard) {
            setInterval(() => {
                const raw = (window.AndroidClipboard.read() || '').trim();
                if (!raw || raw === lastAndroidClipPair) return;
                lastAndroidClipPair = raw;
                const pair = resolveTrackedPair(raw);
                if (pair) receiveTrinityPair(pair);
            }, 400);
        }

        function subscribeSinglePayout(symbol) {
            const stake = parseFloat(document.getElementById('trade-amount').value) || 10;
            const multiplier = Number(multiplierSelect.value) || 100;
            if (payoutSubscriptions[symbol]) {
                ws.send(JSON.stringify({ forget: payoutSubscriptions[symbol] }));
                delete payoutSubscriptions[symbol];
            }
            ws.send(JSON.stringify({
                proposal: 1, subscribe: 1, amount: Number(stake), basis: "stake",
                contract_type: "MULTUP", currency: "USD",
                multiplier: multiplier, underlying_symbol: symbol
            }));
        }

        function ensureQuickPairButton(pair) {
                    if (!pairSelect || pairSelect.querySelector(`option[value="${pair}"]`)) return;
                    const label = pair.replace(/^(frx|cry|1HZ)/i, '');
                    const opt = document.createElement('option');
                    opt.value = pair;
                    opt.textContent = label;
                    pairSelect.appendChild(opt);
                }
        
                setInterval(() => {
            if (marketData[currentPair] && marketData[currentPair].length > 0) drawChart();
        }, 1000);

        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const dashboardEl = document.querySelector('.dashboard-container');

        fullscreenBtn.addEventListener('click', () => {
            if (dashboardEl.requestFullscreen) {
                dashboardEl.requestFullscreen();
            } else if (dashboardEl.webkitRequestFullscreen) {
                dashboardEl.webkitRequestFullscreen();
            }
            fullscreenBtn.style.display = 'none';
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenBtn.style.display = 'flex';
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) {
                fullscreenBtn.style.display = 'flex';
            }
        });

        document.getElementById('zoom-in-btn').addEventListener('click', () => {
            zoomLevel = Math.min(zoomLevel + 1, 300);
            applyZoom();
        });
        document.getElementById('zoom-out-btn').addEventListener('click', () => {
            zoomLevel = Math.max(zoomLevel - 1, 20);
            applyZoom();
        });

        const accountToggleBtn = document.getElementById('account-toggle-btn');
        function updateAccountToggleUI() {
            if (currentAccountType === 'real') {
                accountToggleBtn.innerText = 'LIVE';
                balanceDisplay.style.color = '#0ecb81';
            } else {
                accountToggleBtn.innerText = 'DEMO';
                balanceDisplay.style.color = '#ffcc00';
            }
        }
        balanceDisplay.style.cursor = 'pointer';
        balanceDisplay.addEventListener('click', () => {
            currentAccountType = currentAccountType === 'real' ? 'demo' : 'real';
            updateAccountToggleUI();
            balanceDisplay.innerText = 'Loading...';
            tickSubscriptions = {};
                                    payoutSubscriptions = {};
                                    positions = {};
                                    marketData = {};
                                    candleSubscriptions = {};
                                    backfillPending = {};
                                    pocSubscribed = false;
            if (ws) {
                ws.onclose = null;
                ws.close();
            }
            connect();
        });
        updateAccountToggleUI();

        connect();
    </script>

                navigator.serviceWorker.register('sw.js')
